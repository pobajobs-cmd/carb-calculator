<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journal — Kylo Loki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  header.post { padding: clamp(1.5rem, 5vw, 3rem) 0 1.5rem; border-bottom: 1px solid var(--line); margin-bottom: 1.75rem; }
  .post-date { font-size: 0.82rem; color: var(--gold); font-weight: 600; margin-bottom: 0.4rem; }
  header.post h1 { font-family: var(--font-display); font-weight: 500; font-size: clamp(1.8rem, 1.3rem + 2.4vw, 2.6rem); line-height: 1.15; margin: 0; text-wrap: balance; }
  .video-wrap { position: relative; width: 100%; aspect-ratio: 16/9; border-radius: var(--radius); overflow: hidden; background: var(--paper-tint); margin-bottom: 1.75rem; }
  .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .prose img { max-width: 100%; border-radius: 12px; margin: 1.5rem 0; }
  .back { display: inline-block; margin-top: 2rem; font-size: 0.9rem; font-weight: 600; text-decoration: none; color: var(--ink-soft); }
  .back:hover { color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <header class="site-nav" id="siteNav"></header>
  <div class="narrow">
    <div id="postRoot"><p class="loading">Loading&hellip;</p></div>
    <a class="back" href="/archive/">&larr; All posts</a>
  </div>
</div>
<footer class="site-footer" id="siteFooter"></footer>
<script src="/assets/site.js"></script>
<script src="/assets/journal.js"></script>
<script>
  const slug = new URLSearchParams(location.search).get('slug');
  const root = document.getElementById('postRoot');

  if (!slug) {
    root.innerHTML = '<p class="empty">No post specified.</p>';
  } else {
    fetchPost(slug).then(post => {
      const id = youTubeId(post.video);
      document.title = post.title + ' — Kylo Loki';
      root.innerHTML = `
        <header class="post">
          <div class="post-date">${post.placeholder ? '<span class="badge-ph">Example post</span>' : fmtPostDate(post.date)}</div>
          <h1>${post.title}</h1>
          ${post.placeholder ? '<div class="ph-banner"><span>&#9998;</span><span><strong>This is a placeholder.</strong> It shows how journal posts will look. Our first real post is coming soon.</span></div>' : ''}
        </header>
        ${id ? `<div class="video-wrap"><iframe src="https://www.youtube.com/embed/${id}" title="${post.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>` : ''}
        <div class="prose">${marked.parse(post.body || '')}</div>
      `;
    }).catch(() => {
      root.innerHTML = '<p class="empty">Couldn’t find that post — it may have been moved or renamed.</p>';
    });
  }
</script>
</body>
</html>
