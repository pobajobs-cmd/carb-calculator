<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journal — Kylo Loki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  .post-list { display: flex; flex-direction: column; gap: 0.8rem; }
  .post-row {
    display: grid; grid-template-columns: 180px 1fr; gap: 1.1rem; align-items: center; text-decoration: none;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 0.75rem;
    transition: border-color .2s, transform .2s;
  }
  .post-row:hover { border-color: var(--blue); transform: translateY(-2px); }
  .thumb { position: relative; aspect-ratio: 16/9; border-radius: 9px; overflow: hidden; background: linear-gradient(150deg, var(--blue), var(--blue-deep)); }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .post-row .date { font-size: 0.78rem; color: var(--gold); font-weight: 600; }
  .post-row h3 { font-family: var(--font-display); font-weight: 500; font-size: 1.15rem; line-height: 1.25; margin: 0.15rem 0 0.25rem; }
  .post-row p { margin: 0; color: var(--ink-soft); font-size: 0.88rem; }
  @media (max-width: 560px) { .post-row { grid-template-columns: 110px 1fr; gap: 0.8rem; } .post-row p { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="site-nav" id="siteNav"></header>
  <div class="narrow">
    <header class="page-head">
      <span class="eyebrow">Journal</span>
      <h1>All <em>posts</em></h1>
      <p class="lede">A weekly look at life with T1D, each with a video. Newest first.</p>
    </header>
    <div id="listRoot" class="post-list"><p class="loading">Loading&hellip;</p></div>
  </div>
</div>
<footer class="site-footer" id="siteFooter"></footer>
<script src="/assets/site.js"></script>
<script src="/assets/journal.js"></script>
<script>
  fetchPosts().then(posts => {
    const root = document.getElementById('listRoot');
    if (!posts.length) { root.innerHTML = '<p class="empty">No posts yet.</p>'; return; }
    root.innerHTML = posts.map(p => {
      const vid = youTubeId(p.video);
      return `
      <a class="post-row${p.placeholder ? ' is-placeholder' : ''}" href="/post/?slug=${p.slug}">
        <div class="thumb">${vid ? `<img src="https://i.ytimg.com/vi/${vid}/hqdefault.jpg" alt="" loading="lazy">` : ''}</div>
        <div>
          <div class="date">${p.placeholder ? '<span class="badge-ph">Example post</span>' : fmtPostDate(p.date)}</div>
          <h3>${p.title}</h3>
          ${p.summary ? `<p>${p.summary}</p>` : ''}
        </div>
      </a>`;
    }).join('');
  });
</script>
</body>
</html>
