<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- ======================================================
     This file goes in a folder named by date, e.g.
     journal/2026-09-21/index.html
     The homepage finds it automatically — you never need
     to add it anywhere else. Just fill in the EDITs below.
====================================================== -->

<!-- EDIT 1: same title as EDIT 3 below -->
<title>POST TITLE HERE — Kylo's Journey</title>

<!-- ======================================================
     EDIT 2: these three lines are what the homepage actually
     reads to build its list — keep them even though they're
     invisible on the page itself.
====================================================== -->
<meta name="post-title" content="POST TITLE HERE">
<meta name="post-date" content="2026-09-21">
<meta name="post-summary" content="One short sentence shown in the homepage list.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --paper: #EDF1F3; --paper-tint: #E1E8EB; --card: #F8FBFC;
    --ink: #202B33; --ink-soft: #58666F;
    --blue: #3E6E88; --blue-deep: #2C5064; --gold: #BE8A3E; --line: #C9D6DB;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #16212A; --paper-tint: #1D2B35; --card: #1B2830;
      --ink: #E7EEF1; --ink-soft: #A8B8C0;
      --blue: #7FAFC7; --blue-deep: #5A8CA6; --gold: #DBAA5C; --line: #2E3F49;
    }
  }
  html, body { height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--font-body); font-size: 17px; line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--blue-deep); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 1.5rem 3rem; }

  .back { display: inline-block; padding: 1.5rem 0 0; font-size: 0.88rem; font-weight: 600;
    color: var(--ink-soft); text-decoration: none; }
  .back:hover { color: var(--ink); }

  header.post { padding: 1.25rem 0 1.5rem; border-bottom: 1px solid var(--line); margin-bottom: 1.75rem; }
  .post-date { font-size: 0.82rem; color: var(--gold); font-weight: 600; margin-bottom: 0.4rem; }
  header.post h1 {
    font-family: var(--font-display); font-weight: 500; font-size: clamp(1.6rem, 5vw, 2.2rem);
    line-height: 1.15; margin: 0;
  }

  .video-wrap {
    position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden;
    background: var(--paper-tint); margin-bottom: 1.75rem;
  }
  .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  .post-body p { margin: 0 0 1.1rem; font-size: 1.02rem; }
  .post-body img { max-width: 100%; border-radius: 8px; display: block; margin: 1.5rem 0; }
  .post-body figcaption { font-size: 0.82rem; color: var(--ink-soft); margin-top: -1.1rem; margin-bottom: 1.5rem; }

  footer.post { margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--line);
    font-size: 0.9rem; color: var(--ink-soft); }
</style>
</head>
<body>

<div class="wrap">

  <!-- Link back to the homepage / archive -->
  <a class="back" href="/">&larr; Back to the journal</a>

  <header class="post">
    <!-- EDIT 3: the date shown on the page (match EDIT 2's post-date, and the folder name) -->
    <div class="post-date">September 21, 2026</div>
    <!-- EDIT 4: same title as EDIT 1 and EDIT 2, shown big on the page -->
    <h1>POST TITLE HERE</h1>
  </header>

  <!-- ======================================================
       EDIT 5: the YouTube video.
       Upload your video to YouTube first, then:
       1. Click "Share" under the video on YouTube
       2. Click "Embed"
       3. Copy the web address inside src="..." and paste it
          over YOUR_VIDEO_ID below (keep everything else the same)
  ====================================================== -->
  <div class="video-wrap">
    <iframe
      src="https://www.youtube.com/embed/YOUR_VIDEO_ID"
      title="YouTube video player"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

  <!-- ======================================================
       EDIT 6: the actual journal writing.
       Every paragraph goes between its own <p> and </p> tags.
       To add a photo, copy the <figure> block below and put your
       own image's web address inside src="..."
  ====================================================== -->
  <div class="post-body">
    <p>Write the first paragraph of this week's update here. Keep it as one <code>&lt;p&gt;</code> per paragraph — the spacing takes care of itself.</p>

    <p>A second paragraph goes here, same idea.</p>

    <figure>
      <img src="PHOTO_WEB_ADDRESS_HERE.jpg" alt="A short description of the photo, for accessibility">
      <figcaption>An optional caption under the photo.</figcaption>
    </figure>

    <p>And you can keep writing after a photo too.</p>
  </div>

  <footer class="post">
    <!-- EDIT 7 (optional): link to a previous post once you have one — use its date folder -->
    <a href="/journal/2026-09-14/">&larr; Previous post</a>
  </footer>

</div>

</body>
</html>
