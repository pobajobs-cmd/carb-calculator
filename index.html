<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carb Calculator</title>
<style>
:root {
  --bg: #f4f6f8;
  --card: #fff;
  --text: #111;
  --input-bg: #fff;
  --button-bg: #0077ff;
  --button-text: #fff;
}

body.dark {
  --bg: #121212;
  --card: #1e1e1e;
  --text: #eee;
  --input-bg: #222;
  --button-bg: #2196f3;
  --button-text: #fff;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 1rem;
}

.container {
  max-width: 600px;
  margin: auto;
}

h1 {
  text-align: center;
}

.card {
  background: var(--card);
  padding: 1rem;
  border-radius: 12px;
  margin-bottom: 1rem;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

.ingredient {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  margin-bottom: 1rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid #eee;
}

body.dark .ingredient {
  border-bottom-color: #333;
}

input {
  padding: 0.5rem;
  font-size: 1rem;
  border-radius: 8px;
  border: 1px solid #ccc;
  background: var(--input-bg);
  color: var(--text);
}

button {
  padding: 0.7rem;
  font-size: 1rem;
  border-radius: 8px;
  border: none;
  background: var(--button-bg);
  color: var(--button-text);
  cursor: pointer;
}

button.remove {
  background: #ff4d4d;
}

.result {
  font-weight: bold;
  margin-top: 0.5rem;
}

.toggle-dark {
  display: block;
  margin: 0 auto 1rem;
}
</style>
</head>
<body>
<div class="container">
  <h1>Carb Calculator</h1>
  <button class="toggle-dark" onclick="toggleDarkMode()">Toggle Dark Mode</button>

  <div class="card">
    <h2>Ingredients</h2>
    <div id="ingredients"></div>
    <button onclick="addIngredient()">Add Ingredient</button>
  </div>

  <div class="card">
    <h2>Totals</h2>
    <div>Total Carbs: <span id="totalCarbs">0</span> g</div>
    <div>Total Weight: <span id="totalWeight">0</span> g</div>
    <div>Carbs per 100g: <span id="per100">0</span> g</div>

    <hr>

    <label>Servings:</label>
    <input type="number" id="servings" value="1" oninput="calculate()">

    <div class="result">
      Carbs per Serving: <span id="perServing">0</span> g
    </div>
  </div>
</div>

<script>
/* ------------------ Dark Mode ------------------ */
function toggleDarkMode() {
  document.body.classList.toggle('dark');
  localStorage.setItem('darkMode', document.body.classList.contains('dark'));
}

// Load dark mode preference
if(localStorage.getItem('darkMode') === 'true') {
  document.body.classList.add('dark');
}

/* ------------------ Ingredients ------------------ */
function addIngredient(data = {}) {
  const container = document.getElementById("ingredients");

  const div = document.createElement("div");
  div.className = "ingredient";

  div.innerHTML = `
    <input type="text" placeholder="Ingredient name" value="${data.name || ''}">
    <input type="number" placeholder="Carbs amount" class="carbs" value="${data.carbs || ''}" oninput="calculate()">
    <input type="number" placeholder="Per (g)" class="refWeight" value="${data.refWeight || ''}" oninput="calculate()">
    <input type="number" placeholder="Ingredient weight (g)" class="weight" value="${data.weight || ''}" oninput="calculate()">
    <div>Ingredient Carbs: <span class="ingredientTotal">0</span> g</div>
    <button class="remove" onclick="this.parentElement.remove(); calculate()">Remove</button>
  `;

  container.appendChild(div);
  calculate();
}

/* ------------------ Calculate ------------------ */
function calculate() {
  let totalCarbs = 0;
  let totalWeight = 0;

  const ingredients = document.querySelectorAll(".ingredient");

  ingredients.forEach(ing => {
    const carbs = parseFloat(ing.querySelector(".carbs").value) || 0;
    const ref = parseFloat(ing.querySelector(".refWeight").value) || 0;
    const weight = parseFloat(ing.querySelector(".weight").value) || 0;

    let ingredientCarbs = 0;
    if (ref > 0) ingredientCarbs = (carbs / ref) * weight;

    ing.querySelector(".ingredientTotal").innerText = ingredientCarbs.toFixed(2);
    totalCarbs += ingredientCarbs;
    totalWeight += weight;
  });

  document.getElementById("totalCarbs").innerText = totalCarbs.toFixed(2);
  document.getElementById("totalWeight").innerText = totalWeight.toFixed(2);
  document.getElementById("per100").innerText = totalWeight ? ((totalCarbs / totalWeight) * 100).toFixed(2) : 0;

  const servings = parseFloat(document.getElementById("servings").value) || 1;
  document.getElementById("perServing").innerText = (totalCarbs / servings).toFixed(2);

  // Save to localStorage
  saveState();
}

/* ------------------ Persistence ------------------ */
function saveState() {
  const ingredients = [];
  document.querySelectorAll(".ingredient").forEach(ing => {
    ingredients.push({
      name: ing.querySelector("input[type=text]").value,
      carbs: ing.querySelector(".carbs").value,
      refWeight: ing.querySelector(".refWeight").value,
      weight: ing.querySelector(".weight").value
    });
  });
  localStorage.setItem('recipeData', JSON.stringify({
    ingredients,
    servings: document.getElementById("servings").value
  }));
}

function loadState() {
  const data = JSON.parse(localStorage.getItem('recipeData') || '{}');
  if(data.ingredients) data.ingredients.forEach(addIngredient);
  if(data.servings) document.getElementById("servings").value = data.servings;
}

loadState();
</script>
</body>
</html>
