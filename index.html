<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carb Calculator</title>
<style>
:root {
  --bg: #f4f6f8;
  --card: #fff;
  --text: #111;
  --input-bg: #fff;
  --button-bg: #0077ff;
  --button-text: #fff;
}

body.dark {
  --bg: #121212;
  --card: #1e1e1e;
  --text: #eee;
  --input-bg: #222;
  --button-bg: #2196f3;
  --button-text: #fff;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 1rem;
}

.container {
  max-width: 600px;
  margin: auto;
}

h1 {
  text-align: center;
}

.card {
  background: var(--card);
  padding: 1rem;
  border-radius: 12px;
  margin-bottom: 1rem;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

.ingredient {
  padding: 0.5rem 0;
  display: flex;
  flex-direction: column;
  border-bottom: 1px solid #eee;
}

body.dark .ingredient {
  border-bottom-color: #333;
}

.ingredient-line {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.ingredient-line span {
  flex: 1;
  margin-right: 0.5rem;
}

input {
  padding: 0.3rem;
  font-size: 0.9rem;
  border-radius: 6px;
  border: 1px solid #ccc;
  background: var(--input-bg);
  color: var(--text);
  margin-bottom: 0.3rem;
}

button {
  padding: 0.5rem;
  font-size: 0.9rem;
  border-radius: 6px;
  border: none;
  background: var(--button-bg);
  color: var(--button-text);
  cursor: pointer;
  margin-left: 0.3rem;
}

button.remove {
  background: #ff4d4d;
}

.result {
  font-weight: bold;
  margin-top: 0.5rem;
}

.toggle-dark {
  display: block;
  margin: 0 auto 1rem;
}
</style>
</head>
<body>
<div class="container">
  <h1>Carb Calculator</h1>
  <button class="toggle-dark" onclick="toggleDarkMode()">Toggle Dark Mode</button>

  <div class="card">
    <h2>Ingredients</h2>
    <div id="ingredients"></div>
    <button onclick="addIngredient()">Add Ingredient</button>
  </div>

  <div class="card">
    <h2>Totals</h2>
    <div>Total Carbs: <span id="totalCarbs">0</span> g</div>
    <div>Total Weight: <span id="totalWeight">0</span> g</div>
    <div>Carbs per 100g: <span id="per100">0</span> g</div>

    <hr>

    <label>Servings:</label>
    <input type="number" id="servings" value="1" oninput="calculate()">

    <div class="result">
      Carbs per Serving: <span id="perServing">0</span> g
    </div>
  </div>
</div>

<script>
/* ------------------ Dark Mode ------------------ */
function toggleDarkMode() {
  document.body.classList.toggle('dark');
}

/* ------------------ Ingredients ------------------ */
function addIngredient() {
  const container = document.getElementById("ingredients");
  const div = document.createElement("div");
  div.className = "ingredient";

  // Start in edit mode
  div.innerHTML = ingredientEditHTML({}, true);

  container.appendChild(div);
  calculate();
}

function ingredientEditHTML(data = {}, editMode = true) {
  if(editMode) {
    return `
      <input type="text" placeholder="Ingredient name" value="${data.name || ''}">
      <input type="number" placeholder="Carbs amount" class="carbs" value="${data.carbs || ''}" oninput="calculate()">
      <input type="number" placeholder="Per (g)" class="refWeight" value="${data.refWeight || ''}" oninput="calculate()">
      <input type="number" placeholder="Ingredient weight (g)" class="weight" value="${data.weight || ''}" oninput="calculate()">
      <button onclick="saveIngredient(this)">Save</button>
      <button class="remove" onclick="this.parentElement.remove(); calculate()">Remove</button>
    `;
  } else {
    const totalCarbs = data.refWeight > 0 ? ((data.carbs / data.refWeight) * data.weight).toFixed(2) : '0.00';
    return `
      <div class="ingredient-line">
        <span>${data.name || ''} — ${data.carbs || 0}g / ${data.refWeight || 0}g — ${data.weight || 0}g — ${totalCarbs}g total</span>
        <button onclick="editIngredient(this)">Edit</button>
        <button class="remove" onclick="this.parentElement.parentElement.remove(); calculate()">Remove</button>
      </div>
    `;
  }
}

function saveIngredient(button) {
  const parent = button.parentElement;
  const data = {
    name: parent.querySelector('input[type=text]').value,
    carbs: parseFloat(parent.querySelector('.carbs').value) || 0,
    refWeight: parseFloat(parent.querySelector('.refWeight').value) || 0,
    weight: parseFloat(parent.querySelector('.weight').value) || 0
  };
  parent.innerHTML = ingredientEditHTML(data, false);
  calculate();
}

function editIngredient(button) {
  const parent = button.parentElement.parentElement;
  const parts = parent.querySelector('span').innerText.split(' — ');
  const data = {
    name: parts[0],
    carbs: parseFloat(parts[1]),
    refWeight: parseFloat(parts[2]),
    weight: parseFloat(parts[3]),
  };
  parent.innerHTML = ingredientEditHTML(data, true);
}

/* ------------------ Calculate ------------------ */
function calculate() {
  let totalCarbs = 0;
  let totalWeight = 0;

  document.querySelectorAll(".ingredient").forEach(ing => {
    const inputs = ing.querySelectorAll("input");
    if(inputs.length === 0) { // compact view
      const parts = ing.querySelector('span').innerText.split(' — ');
      const carbs = parseFloat(parts[1]) || 0;
      const refWeight = parseFloat(parts[2]) || 0;
      const weight = parseFloat(parts[3]) || 0;
      if(refWeight > 0) totalCarbs += (carbs / refWeight) * weight;
      totalWeight += weight;
    } else { // still editing, don't count yet
      const carbs = parseFloat(ing.querySelector('.carbs').value) || 0;
      const refWeight = parseFloat(ing.querySelector('.refWeight').value) || 0;
      const weight = parseFloat(ing.querySelector('.weight').value) || 0;
      if(refWeight > 0) totalCarbs += (carbs / refWeight) * weight;
      totalWeight += weight;
    }
  });

  document.getElementById("totalCarbs").innerText = totalCarbs.toFixed(2);
  document.getElementById("totalWeight").innerText = totalWeight.toFixed(2);
  document.getElementById("per100").innerText = totalWeight ? ((totalCarbs / totalWeight) * 100).toFixed(2) : 0;

  const servings = parseFloat(document.getElementById("servings").value) || 1;
  document.getElementById("perServing").innerText = (totalCarbs / servings).toFixed(2);
}
</script>
</body>
</html>
