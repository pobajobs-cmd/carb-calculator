<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carb Calculator</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f4f6f8;
  margin: 0;
  padding: 1rem;
}

.container {
  max-width: 600px;
  margin: auto;
}

h1 {
  text-align: center;
}

.card {
  background: white;
  padding: 1rem;
  border-radius: 12px;
  margin-bottom: 1rem;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

.ingredient {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  margin-bottom: 1rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid #eee;
}

input {
  padding: 0.5rem;
  font-size: 1rem;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  padding: 0.7rem;
  font-size: 1rem;
  border-radius: 8px;
  border: none;
  background: #0077ff;
  color: white;
}

button.remove {
  background: #ff4d4d;
}

.result {
  font-weight: bold;
  margin-top: 0.5rem;
}
</style>
</head>
<body>

<div class="container">
  <h1>Carb Calculator</h1>

  <div class="card">
    <h2>Ingredients</h2>
    <div id="ingredients"></div>
    <button onclick="addIngredient()">Add Ingredient</button>
  </div>

  <div class="card">
    <h2>Totals</h2>

    <div>Total Carbs: <span id="totalCarbs">0</span> g</div>
    <div>Total Weight: <span id="totalWeight">0</span> g</div>
    <div>Carbs per 100g: <span id="per100">0</span> g</div>

    <hr>

    <label>Servings:</label>
    <input type="number" id="servings" value="1" oninput="calculate()">

    <div class="result">
      Carbs per Serving: <span id="perServing">0</span> g
    </div>
  </div>
</div>

<script>
function addIngredient() {
  const container = document.getElementById("ingredients");

  const div = document.createElement("div");
  div.className = "ingredient";

  div.innerHTML = `
    <input type="text" placeholder="Ingredient name">
    <input type="number" placeholder="Carbs amount" class="carbs" oninput="calculate()">
    <input type="number" placeholder="Per (g)" class="refWeight" oninput="calculate()">
    <input type="number" placeholder="Ingredient weight (g)" class="weight" oninput="calculate()">
    <div>Ingredient Carbs: <span class="ingredientTotal">0</span> g</div>
    <button class="remove" onclick="this.parentElement.remove(); calculate()">Remove</button>
  `;

  container.appendChild(div);
}

function calculate() {
  let totalCarbs = 0;
  let totalWeight = 0;

  const ingredients = document.querySelectorAll(".ingredient");

  ingredients.forEach(ing => {
    const carbs = parseFloat(ing.querySelector(".carbs").value) || 0;
    const ref = parseFloat(ing.querySelector(".refWeight").value) || 0;
    const weight = parseFloat(ing.querySelector(".weight").value) || 0;

    let ingredientCarbs = 0;

    if (ref > 0) {
      ingredientCarbs = (carbs / ref) * weight;
    }

    ing.querySelector(".ingredientTotal").innerText = ingredientCarbs.toFixed(2);

    totalCarbs += ingredientCarbs;
    totalWeight += weight;
  });

  document.getElementById("totalCarbs").innerText = totalCarbs.toFixed(2);
  document.getElementById("totalWeight").innerText = totalWeight.toFixed(2);

  const per100 = totalWeight > 0 ? (totalCarbs / totalWeight) * 100 : 0;
  document.getElementById("per100").innerText = per100.toFixed(2);

  const servings = parseFloat(document.getElementById("servings").value) || 1;
  const perServing = totalCarbs / servings;
  document.getElementById("perServing").innerText = perServing.toFixed(2);
}

addIngredient();
</script>

</body>
</html>
